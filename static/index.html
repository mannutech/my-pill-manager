<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>my-pill-manager</title>
  <style>
    body { font-family: system-ui; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    .low { border-color: #e67e22; }
    .due { border-color: #c0392b; background: #fdf0ee; }
    button { padding: .4rem .9rem; cursor: pointer; }
    input, label { display: block; margin: .3rem 0; }
    #proposal input { width: 100%; box-sizing: border-box; }
    .muted { color: #888; font-size: .85rem; }
  </style>
</head>
<body>
  <h1>my-pill-manager</h1>

  <div class="card">
    <h3>Add a med from a photo</h3>
    <input type="file" id="photo" accept="image/*" capture="environment">
  </div>

  <div id="question" class="card" style="display:none">
    <h3>The agent has a question</h3>
    <p id="q_text"></p>
    <input id="q_answer" placeholder="your answer">
    <button onclick="sendAnswer()">Send</button>
  </div>

  <div id="proposal" class="card" style="display:none">
    <h3>Confirm what I read</h3>
    <label>Name <input id="p_name"></label>
    <label>Dose <input id="p_dose"></label>
    <label>Times/day <input id="p_tpd" type="number" min="1" max="6"></label>
    <label>Dose times (comma separated HH:MM) <input id="p_times"></label>
    <label>Quantity dispensed <input id="p_qty" type="number" min="1"></label>
    <p class="muted" id="p_conf"></p>
    <button onclick="confirmMed()">Looks right — save it</button>
  </div>

  <div id="meds"></div>

  <script>
    let proposal = null;
    let draftId = null;

    function showProposal(p) {
      proposal = p;
      document.getElementById("p_name").value = p.name;
      document.getElementById("p_dose").value = p.dose;
      document.getElementById("p_tpd").value = p.times_per_day;
      document.getElementById("p_times").value = p.dose_times.join(", ");
      document.getElementById("p_qty").value = p.quantity_total;
      document.getElementById("p_conf").textContent =
        `confidence: ${(p.confidence * 100).toFixed(0)}% — edit anything that looks wrong`;
      document.getElementById("question").style.display = "none";
      document.getElementById("proposal").style.display = "block";
    }

    function showQuestion(q, id) {
      draftId = id;
      document.getElementById("q_text").textContent = q;
      document.getElementById("q_answer").value = "";
      document.getElementById("question").style.display = "block";
    }

    function handleResult(r, data) {
      if (!r.ok) { alert(data.detail); return; }
      if (data.type === "proposal") showProposal(data.proposal);
      else if (data.type === "question") showQuestion(data.question, data.draft_id || draftId);
      else alert("Agent couldn't finish: " + (data.detail || "unknown"));
    }

    document.getElementById("photo").onchange = async (e) => {
      const fd = new FormData();
      fd.append("photo", e.target.files[0]);
      const r = await fetch("/api/extract", { method: "POST", body: fd });
      handleResult(r, await r.json());
    };

    async function sendAnswer() {
      const r = await fetch(`/api/extract/${draftId}/answer`, { method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({answer: document.getElementById("q_answer").value}) });
      handleResult(r, await r.json());
    }

    async function confirmMed() {
      const entry = {
        name: p_name.value, dose: p_dose.value,
        times_per_day: +p_tpd.value,
        dose_times: p_times.value.split(",").map(s => s.trim()),
        quantity_total: +p_qty.value, confidence: proposal.confidence,
      };
      await fetch("/api/meds", { method: "POST",
        headers: {"Content-Type": "application/json"}, body: JSON.stringify(entry) });
      document.getElementById("proposal").style.display = "none";
      load();
    }

    function isDue(m) {
      // In-app reminder: a dose is "due" if a scheduled time passed within
      // the last hour and there's stock left. Deliberately simple.
      const now = new Date();
      const cur = now.getHours() * 60 + now.getMinutes();
      return m.dose_times.some(t => {
        const [h, min] = t.split(":").map(Number);
        const d = cur - (h * 60 + min);
        return d >= 0 && d < 60;
      }) && m.quantity_remaining > 0;
    }

    async function load() {
      const { meds, low_stock } = await (await fetch("/api/meds")).json();
      const lowIds = new Set(low_stock.map(m => m.id));
      document.getElementById("meds").innerHTML = meds.map(m => `
        <div class="card ${lowIds.has(m.id) ? "low" : ""} ${isDue(m) ? "due" : ""}">
          <b>${m.name}</b> ${m.dose} — ${m.times_per_day}×/day at ${m.dose_times.join(", ")}
          <br>Stock: ${m.quantity_remaining}/${m.quantity_total}
          ${lowIds.has(m.id) ? " <b>⚠ refill soon</b>" : ""}
          ${isDue(m) ? " <b>⏰ dose due</b>" : ""}
          <br><button onclick="took('${m.id}')">Took it</button>
        </div>`).join("") || "<p class='muted'>No meds yet — snap a photo of a label.</p>";
    }

    async function took(id) {
      await fetch(`/api/meds/${id}/taken`, { method: "POST" });
      load();
    }

    load();
    setInterval(load, 60000); // re-check "due" every minute
  </script>
</body>
</html>
